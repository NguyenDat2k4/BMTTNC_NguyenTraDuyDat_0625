<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Caesar Cipher Tool</h2>

        <!-- Mã hóa -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">Encryption</div>
            <div class="card-body">
                <form method="POST" action="/caesar">
                    <input type="hidden" name="action" value="encrypt">
                    <div class="form-group">
                        <label>Plain Text:</label>
                        <input type="text" class="form-control" name="inputPlainText" required>
                    </div>
                    <div class="form-group">
                        <label>Key:</label>
                        <input type="number" class="form-control" name="inputKeyPlain" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Encrypt</button>
                </form>
            </div>
        </div>

        <!-- Giải mã -->
        <div class="card">
            <div class="card-header bg-success text-white">Decryption</div>
            <div class="card-body">
                <form method="POST" action="/caesar">
                    <input type="hidden" name="action" value="decrypt">
                    <div class="form-group">
                        <label>Cipher Text:</label>
                        <input type="text" class="form-control" name="inputCipherText" required>
                    </div>
                    <div class="form-group">
                        <label>Key:</label>
                        <input type="number" class="form-control" name="inputKeyCipher" required>
                    </div>
                    <button type="submit" class="btn btn-success">Decrypt</button>
                </form>
            </div>
        </div>

        <!-- Hiển thị kết quả -->
        {% if result %}
        <div class="mt-4 p-4 border rounded" style="background-color: #f8f9fa;">
            <h5 class="mb-3">Kết quả {{ 'mã hóa' if result.type == 'encrypt' else 'giải mã' }}:</h5>
            <p><strong>Văn bản gốc:</strong> {{ result.text }}</p>
            <p><strong>Khóa:</strong> {{ result.key }}</p>
            <p><strong>Kết quả:</strong> {{ result.result }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
