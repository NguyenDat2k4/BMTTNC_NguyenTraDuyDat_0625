<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rail Fence Cipher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }
    button {
      background: #3498db;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #2980b9;
    }
    .output {
      background: #ecf0f1;
      padding: 10px;
      border-radius: 5px;
      min-height: 50px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Rail Fence Cipher</h2>
    <label for="numRails">Số Rail:</label>
    <input type="number" id="numRails" min="2" value="3"/>

    <label for="plainText">Văn bản gốc (Plain Text):</label>
    <textarea id="plainText" rows="3"></textarea>
    <button onclick="encrypt()">Mã hóa</button>

    <label for="cipherText">Văn bản mã hóa (Cipher Text):</label>
    <textarea id="cipherText" rows="3"></textarea>
    <button onclick="decrypt()">Giải mã</button>

    <h3>Kết quả:</h3>
    <div class="output" id="result"></div>
  </div>

  <script>
    class RailFenceCipher {
      encrypt(text, numRails) {
        let rails = Array.from({length: numRails}, () => []);
        let railIndex = 0, direction = 1;

        for (let char of text) {
          rails[railIndex].push(char);
          if (railIndex === 0) direction = 1;
          else if (railIndex === numRails - 1) direction = -1;
          railIndex += direction;
        }

        return rails.flat().join('');
      }

      decrypt(cipherText, numRails) {
        let railLengths = Array(numRails).fill(0);
        let railIndex = 0, direction = 1;

        for (let i = 0; i < cipherText.length; i++) {
          railLengths[railIndex]++;
          if (railIndex === 0) direction = 1;
          else if (railIndex === numRails - 1) direction = -1;
          railIndex += direction;
        }

        let rails = [];
        let start = 0;
        for (let len of railLengths) {
          rails.push(cipherText.slice(start, start + len).split(''));
          start += len;
        }

        let result = '', idx = 0;
        railIndex = 0; direction = 1;

        for (let i = 0; i < cipherText.length; i++) {
          result += rails[railIndex].shift();
          if (railIndex === 0) direction = 1;
          else if (railIndex === numRails - 1) direction = -1;
          railIndex += direction;
        }

        return result;
      }
    }

    const cipher = new RailFenceCipher();

    function encrypt() {
      const text = document.getElementById("plainText").value;
      const numRails = parseInt(document.getElementById("numRails").value);
      const encrypted = cipher.encrypt(text, numRails);
      document.getElementById("cipherText").value = encrypted;
      document.getElementById("result").innerText = `Mã hóa: ${encrypted}`;
    }

    function decrypt() {
      const text = document.getElementById("cipherText").value;
      const numRails = parseInt(document.getElementById("numRails").value);
      const decrypted = cipher.decrypt(text, numRails);
      document.getElementById("plainText").value = decrypted;
      document.getElementById("result").innerText = `Giải mã: ${decrypted}`;
    }
  </script>
</body>
</html>
